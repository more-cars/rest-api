apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api-http-route.yaml
  - api-https-route.yaml
  - api-service.yaml
  - api-deployment.yaml
  - db-service.yaml
  - db-pvc.yaml
  - db-deployment.yaml
  - openapi-spec-http-route.yaml
  - openapi-spec-https-route.yaml
  - openapi-spec-service.yaml
  - openapi-spec-deployment.yaml
  - backup-db-cronjob.yaml
  - oauth2-proxy-deployment.yaml
  - oauth2-proxy-service.yaml
  - oauth2-proxy-health-check.yaml

patches:
  - path: api-deployment.patch.json
    target:
      kind: Deployment
      name: api
  - path: openapi-spec-deployment.patch.json
    target:
      kind: Deployment
      name: openapi-spec
  - path: api-http-route.patch.json
    target:
      kind: HTTPRoute
      name: api-http
  - path: api-https-route.patch.json
    target:
      kind: HTTPRoute
      name: api-https
  - path: openapi-spec-http-route.patch.json
    target:
      kind: HTTPRoute
      name: openapi-spec-http
  - path: openapi-spec-https-route.patch.json
    target:
      kind: HTTPRoute
      name: openapi-spec-https
  - path: oauth2-proxy-deployment.patch.json
    target:
      kind: Deployment
      name: oauth2-proxy-api
