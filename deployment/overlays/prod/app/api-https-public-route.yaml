apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-public-https
spec:
  hostnames:
    - api.more-cars.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: more-cars-gateway
      sectionName: more-cars-api-public-https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: api
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
